# omarchy-rpi-boot: the omarchy-rpi-disk-id hook gives a flashed image's disk an
# identifier of its own on its first boot (/usr/lib/initcpio/hooks/). It runs
# after udev has found the disks and before the root is mounted, so it goes just
# before filesystems, whatever HOOKS the files before this one set.
_omarchy_rpi_hooks=()
for _omarchy_rpi_hook in "${HOOKS[@]}"; do
  if [[ $_omarchy_rpi_hook == "filesystems" ]]; then
    _omarchy_rpi_hooks+=(omarchy-rpi-disk-id)
  fi
  if [[ $_omarchy_rpi_hook != "omarchy-rpi-disk-id" ]]; then
    _omarchy_rpi_hooks+=("$_omarchy_rpi_hook")
  fi
done
HOOKS=("${_omarchy_rpi_hooks[@]}")
unset _omarchy_rpi_hook _omarchy_rpi_hooks
