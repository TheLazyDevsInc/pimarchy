# mkinitcpio sources etc/mkinitcpio.conf.d/*.conf in name order (verified with
# `ls etc/mkinitcpio.conf.d/`): omarchy_hooks.conf, then this file, then
# thunderbolt_module.conf. This file has to sort after omarchy_hooks.conf so
# the HOOKS= reassignment below is the one that sticks — a drop-in sorting
# before omarchy_hooks.conf would have its HOOKS value immediately clobbered
# by that file's own unconditional HOOKS=(...) line.
#
# omarchy_hooks.conf's HOOKS line assumes x86:
#
#   HOOKS=(base udev plymouth keyboard autodetect microcode modconf kms
#          keymap consolefont block encrypt filesystems fsck btrfs-overlayfs)
#
# `microcode` loads Intel/AMD CPU microcode updates, which do not exist for
# aarch64. `btrfs-overlayfs` comes from the limine-mkinitcpio-hook package,
# which this port does not install because there is no UEFI and therefore no
# Limine. `encrypt` is for the LUKS root the v1 Pi image deliberately does
# not have — argon2id is punishing on a Cortex-A72, and getting the KDF
# tuning wrong on a microSD card is the easiest way to end up with an
# unbootable machine. `plymouth` is held back until its theme is verified
# against vc4 KMS rather than the DRM drivers it was designed against.
#
# None of these hooks degrade gracefully when they can't run: mkinitcpio
# resolves every HOOKS entry to an install/runtime script pair under
# /usr/lib/initcpio, and a name it cannot find aborts the whole `mkinitcpio -P`
# run rather than skipping that hook. So on a Pi these have to come out of
# HOOKS entirely, not just be left inert.
#
# Checked directly against the device tree rather than by shelling out to
# omarchy-hw-raspberry-pi: mkinitcpio sources conf.d drop-ins as plain bash in
# whatever environment it was invoked from, which is not guaranteed to have
# Omarchy's bin/ on PATH.
if [[ -r /proc/device-tree/model ]] && tr -d '\0' </proc/device-tree/model | grep -qi "raspberry pi"; then
  HOOKS=(base udev keyboard autodetect modconf kms keymap consolefont block filesystems fsck)

  # vc4 (display/KMS) and v3d (render) are the two DRM drivers the whole
  # graphics stack depends on. Pulling them into the initramfs means the
  # console — and any early KMS consumer added later, such as a Plymouth
  # theme once one is verified on vc4 — gets a framebuffer as soon as
  # autodetect can find one, instead of waiting for udev to load the module
  # from the root filesystem after pivot_root.
  MODULES+=(vc4 v3d)
fi

# thunderbolt_module.conf sorts after this file for the same name-order
# reason explained above, which is why its unconditional MODULES+=(thunderbolt)
# is guarded directly in that file rather than being filtered back out from
# here: by the time this file runs, thunderbolt_module.conf has not executed
# yet, so there is nothing in MODULES yet to filter.
