# There is no Thunderbolt controller on a Raspberry Pi — no PCIe at all, in
# fact — so skip loading a module for hardware that cannot be present.
#
# This has to guard here rather than being filtered back out of MODULES from
# etc/mkinitcpio.conf.d/omarchy_rpi.conf: mkinitcpio sources conf.d drop-ins
# in name order, and "omarchy_rpi.conf" sorts before "thunderbolt_module.conf"
# (verified with `ls etc/mkinitcpio.conf.d/`), so that file runs first, before
# this MODULES+=(thunderbolt) line has executed. Removing an entry that has
# not been added yet is a no-op, so the guard has to live here instead.
#
# Checked directly against the device tree, the same way omarchy_rpi.conf
# does, rather than by shelling out to omarchy-hw-raspberry-pi: mkinitcpio
# sources these as plain bash in whatever environment it was invoked from,
# which is not guaranteed to have Omarchy's bin/ on PATH.
if ! { [[ -r /proc/device-tree/model ]] && tr -d '\0' </proc/device-tree/model | grep -qi "raspberry pi"; }; then
  MODULES+=(thunderbolt)
fi
