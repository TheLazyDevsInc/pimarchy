# See the pacman.conf(5) manpage for option and repository directives
# Arch Linux ARM provides the aarch64 repositories used below, including [alarm],
# which carries the Raspberry Pi bootloader and firmware.

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# pacman searches repositories in the order defined here, and installs and
# upgrades a package from the first repository that has it. [pimarchy] comes
# first: it holds the Omarchy packages built from this machine's Pimarchy
# checkout (omarchy-update-rpi-pkgs), so they win over [omarchy]'s builds of the
# same names, which don't know the Raspberry Pi. Only root writes it, and its
# packages are built on this machine, so they carry no signature.
[pimarchy]
SigLevel = Optional TrustAll
Server = file:///var/lib/pimarchy/repo

# Omarchy comes next, as on x86_64, so a package it also publishes is installed
# from Omarchy.
[omarchy]
Server = https://pkgs.omarchy.org/rc/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist
